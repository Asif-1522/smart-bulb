<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Room</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(47, 47, 47);
            width: 100vw;
            height: 100vh;
            display: grid;
            place-content: center;
        }

        div {
            background-color: rgb(59, 26, 26);
            width: 350px;
            text-align: center;
            border-radius: 20px;
        }

        img {
            width: 100%;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        h1 {
            font-size: 30px;
            color: aqua;
        }
        p {
            color: #f3f6f8;
            font-size: 18px;
        }
        button {
            background-color: black;
            color: aliceblue;
            width: 80%;
            height: 40px;
            font-size: 20px;
            margin: 5px;
            border-radius: 100px;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.6);
        }
    </style>
</head>

<body>
    <div>
        <img src="Bulboff.png" alt="" id="bulb">
        <h1><b>Smart Light</b></h1>
        <p>Control your room lighting with one click.</p>
        <button onclick="change()" id="btn">Turn On</button>
    </div>


    <script>
        let bulb = document.getElementById('bulb');
        let btn = document.getElementById('btn');
        const audio = new Audio('click.mp3');
        let light = false;

        function change() {
            audio.play();

            if (light == false) {
                bulb.setAttribute("src", "Bulbon.png");
                light = true;
                btn.innerHTML = "Turn Off";
            }
            else {
                bulb.setAttribute("src", "Bulboff.png");
                light = false;
                btn.innerHTML = "Turn On";
            }
        }
    </script>
</body>

</html>
